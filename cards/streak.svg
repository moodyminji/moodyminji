<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Contribution Streak">
  <title>Contribution Streak</title>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .title { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #0969da; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #57606a; }
    .value { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #1f2328; }
    .big { font: 700 26px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #1f2328; }
    .hl { fill: #0969da; }
    .muted { font: 400 11px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #6e7781; }
    .icon { fill: #0969da; }
    .track { fill: #eaeef2; }
    .ring { stroke: #0969da; }
    .divider { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #58a6ff; }
      .label { fill: #8b949e; }
      .value, .big { fill: #e6edf3; }
      .hl { fill: #58a6ff; }
      .muted { fill: #7d8590; }
      .icon { fill: #58a6ff; }
      .track { fill: #21262d; }
      .ring { stroke: #58a6ff; }
      .divider { stroke: #30363d; }
    }
    .fade { animation: fade .5s ease-out both; }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <rect class="bg" x="0.5" y="0.5" rx="8" width="494" height="194"/>
  <text class="title" x="22" y="34">Contribution Streak</text>
  
  <g class="fade" transform="translate(85 0)">
    
    <text class="big" x="0" y="96" text-anchor="middle">240</text>
    <text class="value" x="0" y="126" text-anchor="middle">Total contributions</text>
    <text class="muted" x="0" y="146" text-anchor="middle">3 Apr 2021 – present</text>
  </g>
   <line class="divider" x1="165" y1="56" x2="165" y2="172"/>
   
  <g class="fade" transform="translate(247.5 0)">
    <circle class="ring" cx="0" cy="98" r="36" fill="none" stroke-width="5"/>
      <circle class="bg" cx="0" cy="60" r="13" stroke="none"/>
      <path class="icon" transform="translate(-8 51)" d="M9.533.753V.752c.217 2.385 1.463 3.626 2.653 4.81C13.37 6.74 14.498 7.863 14.498 10c0 3.5-3 6-6.5 6S1.5 13.512 1.5 10c0-1.298.536-2.56 1.425-3.286.376-.308.862 0 1.035.454C4.46 8.487 5.581 8.419 6 8c.282-.282.341-.811-.003-1.5C4.34 3.187 7.035.75 8.77.146c.39-.137.726.194.763.607ZM7.998 14.5c2.832 0 5-1.98 5-4.5 0-1.463-.68-2.19-1.879-3.383l-.036-.037c-1.013-1.008-2.3-2.29-2.834-4.434-.322.256-.63.579-.864.953-.432.696-.621 1.58-.046 2.73.473.947.67 2.284-.278 3.232-.61.61-1.545.84-2.403.633a2.79 2.79 0 0 1-1.436-.874A3.198 3.198 0 0 0 3 10c0 2.53 2.164 4.5 4.998 4.5Z"/>
    <text class="big" x="0" y="108" text-anchor="middle">2</text>
    <text class="value" x="0" y="152" text-anchor="middle">Current streak</text>
    <text class="muted" x="0" y="170" text-anchor="middle">ending 6 Nov 2026</text>
  </g>
   <line class="divider" x1="330" y1="56" x2="330" y2="172"/>
   
  <g class="fade" transform="translate(410 0)">
    
    <text class="big" x="0" y="96" text-anchor="middle">8</text>
    <text class="value" x="0" y="126" text-anchor="middle">Longest streak</text>
    <text class="muted" x="0" y="146" text-anchor="middle">18 Aug 2025 – 25 Aug 2025</text>
  </g>
</svg>
